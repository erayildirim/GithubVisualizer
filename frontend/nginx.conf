server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The browser only ever talks to this origin, so the API needs no CORS in production.
    location /api/ {
        proxy_pass http://backend-api:5225;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A first-time language breakdown can take a while for accounts with many repositories.
        proxy_read_timeout 90s;
    }

    # File names under /assets contain a content hash, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
