services:
  backend-api:
    build:
      context: ./backend
    container_name: github-visualizer-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Optional. Raises the GitHub quota from 60 to 5,000 requests per hour. See .env.example.
      - GitHub__Token=${GITHUB_TOKEN:-}
      # nginx is the only way in, so the client address it forwards can be trusted.
      - ReverseProxy__Enabled=true
    # Reachable by the frontend container only, not published on the host.
    expose:
      - "5225"
    restart: unless-stopped

  frontend-app:
    build:
      context: ./frontend
    container_name: github-visualizer-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend-api
    restart: unless-stopped
